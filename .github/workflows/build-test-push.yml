name: Develop Validation and Promotion

on:
  # Develop pushes run every check and promote only after all jobs succeed.
  push:
    branches: [develop]
  # Pull requests run the same checks but never promote or deploy.
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build-and-unit-tests:
    name: Android Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 37
        run: sdkmanager "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Project
        run: ./gradlew build --stacktrace

      - name: Run Unit Tests
        run: ./gradlew :androidApp:testDebugUnitTest :shared:testAndroidHostTest --stacktrace

  android-instrumented-tests:
    name: Android Instrumented Tests (API ${{ matrix.api-level }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [29, 30, 33, 35]
        target: [default, google_apis]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew :androidApp:connectedCheck --stacktrace

  ios-framework-validation:
    name: iOS Framework Validation
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Shared iOS Framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

  worker-validation:
    name: Worker Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Worker Dependencies
        run: npm ci

      - name: Validate Worker Deployment
        run: npx wrangler deploy --dry-run

  promote-to-master:
    name: Promote Develop to Master
    runs-on: ubuntu-latest
    needs:
      - android-build-and-unit-tests
      - android-instrumented-tests
      - ios-framework-validation
      - worker-validation
    # Prevent pull-request and manual validation runs from changing master.
    if: github.event_name == 'push'
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push Changes to Master
        # Keep master as an exact promotion of the validated develop commit.
        run: git push --force origin HEAD:master

      - name: Deploy Worker from Promoted Master
        # GITHUB_TOKEN pushes do not trigger other workflows, so dispatch the Worker deployment explicitly.
        run: gh workflow run deploy-worker.yml --ref master
        env:
          GH_TOKEN: ${{ github.token }}
