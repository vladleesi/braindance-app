name: Master Worker Deployment

on:
  # Direct pushes and merges to master deploy without rerunning develop validation.
  push:
    branches: [master]
  # Allows an intentional redeploy of the current master revision.
  workflow_dispatch:
  # Develop validation calls this directly because its GITHUB_TOKEN promotion cannot trigger a push workflow.
  workflow_call:
    inputs:
      promoted:
        description: Deploy the master revision promoted from develop
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy-worker:
    name: Deploy Worker
    # A manual run from another branch must not deploy that branch.
    if: inputs.promoted || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Worker Dependencies
        run: npm ci

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
